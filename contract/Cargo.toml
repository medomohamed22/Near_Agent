[package]
name = "carpass"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "CarPass: used-car passport records and escrowed sale on NEAR testnet"
repository = "https://github.com/medomohamed22/Near_Agent"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
